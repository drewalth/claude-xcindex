type_name:
  allowed_symbols: "_"
identifier_name:
  min_length: 2
line_length:
  warning: 220
  error: 250
file_length:
  warning: 1000
  error: 1500

included:
  - service

excluded:
  - .build
  - .git
  - .github
  - service/.build
  - service/Tests/Fixtures

disabled_rules:
  - trailing_whitespace

opt_in_rules:
  - implicitly_unwrapped_optional